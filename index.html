<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アウト発表パッド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#DDE1E6; --panel:#EEF0F3; --ink:#1E2430; --sub:#5B6472; --line:#C3C9D1;
  --pad-shadow:rgba(20,28,40,.28); --focus:#2E86DE; --out:#E0412F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171A20; --panel:#22262E; --ink:#ECEEF2; --sub:#9AA3B0; --line:#363C47;
    --pad-shadow:rgba(0,0,0,.55); --focus:#6CB2FF; --out:#FF5A45;
  }
}
:root[data-theme="dark"]{
  --bg:#171A20; --panel:#22262E; --ink:#ECEEF2; --sub:#9AA3B0; --line:#363C47;
  --pad-shadow:rgba(0,0,0,.55); --focus:#6CB2FF; --out:#FF5A45;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
  font-weight:500;line-height:1.6;-webkit-tap-highlight-color:transparent;
}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-weight:400;font-size:clamp(1.6rem,4vw,2.3rem);margin:0 0 4px;line-height:1.15}
.hint{color:var(--sub);font-size:.92rem;margin:0 0 16px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* 発表ボード：何が読み上げられるかを常に見せる */
.board{
  background:#1E2430;color:#fff;border-radius:18px;padding:18px 20px;margin-bottom:16px;
  min-height:96px;display:flex;align-items:center;flex-wrap:wrap;gap:4px 2px;
  font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-size:clamp(1.25rem,4.4vw,2rem);line-height:1.3;
}
.board .ph{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:1rem;color:#9AA3B0}
.board .w{opacity:.38;transition:opacity .12s,color .12s}
.board .w.on{opacity:1}
.board .w.dd{color:#F7C948}
.board .w.out{color:#FF6B57}

.grid{
  display:grid;gap:12px;grid-template-columns:repeat(3,1fr);
  background:var(--panel);padding:14px;border-radius:22px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 1px 0 var(--line);
}
.tile{
  --c:#2E86DE;position:relative;aspect-ratio:4/3;border:0;border-radius:16px;cursor:pointer;
  background:var(--c);color:#fff;padding:12px;display:flex;align-items:flex-end;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.25),0 4px 8px var(--pad-shadow);
  transition:transform .06s ease,box-shadow .06s ease,filter .15s;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  filter:saturate(.5) brightness(.95);
}
.tile .name{font-weight:700;font-size:clamp(1.05rem,3.6vw,1.45rem);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.tile .order{
  position:absolute;top:10px;left:10px;width:32px;height:32px;border-radius:50%;border:2.5px solid rgba(255,255,255,.85);
  display:grid;place-items:center;font-weight:700;font-size:1rem;background:rgba(0,0,0,.15);
}
.tile[aria-pressed="true"]{filter:none;box-shadow:0 0 0 4px var(--ink),inset 0 -6px 0 rgba(0,0,0,.18),0 4px 8px var(--pad-shadow)}
.tile[aria-pressed="true"] .order{background:#fff;color:#1E2430;border-color:#fff}
.tile:active{transform:translateY(3px)}
.tile.all{--c:var(--out)}
.tile.speaking{filter:brightness(1.2)!important}

.go{display:flex;gap:10px;margin-top:16px}
.ok{
  flex:1;border:0;border-radius:18px;padding:18px;cursor:pointer;
  background:var(--out);color:#fff;font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-size:clamp(1.4rem,5vw,2rem);
  box-shadow:inset 0 -7px 0 rgba(0,0,0,.2),0 5px 10px var(--pad-shadow);
}
.ok:active{transform:translateY(3px)}
.ok:disabled{opacity:.45;cursor:not-allowed;transform:none}
.ok.stop{background:var(--ink);color:var(--bg)}
.clear{border:1.5px solid var(--line);background:var(--panel);border-radius:18px;padding:0 20px;font-weight:700;cursor:pointer}
.clear:hover{border-color:var(--ink)}

details{margin-top:18px;background:var(--panel);border-radius:14px;padding:4px 16px}
summary{cursor:pointer;font-weight:700;padding:10px 0}
.set{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;padding:4px 0 14px;font-size:.92rem}
.set label{color:var(--sub);font-weight:700}
.set input[type=range]{width:100%;accent-color:var(--ink)}
.set select{font:inherit;padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);grid-column:2 / 4}
.set output{min-width:3.6em;text-align:right;font-variant-numeric:tabular-nums}
.vol{display:flex;align-items:center;gap:8px}
.top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.top .t{flex:1;min-width:220px}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 16px;font-weight:700;font-size:.92rem;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"],.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:#D1453B;border-color:#E5A39D}
.editbar{display:none;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1.5px dashed var(--line);
  border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
.editbar span{flex:1;min-width:200px}
body.editing .editbar{display:flex}
body.editing .tile:not(.all){outline:2px dashed rgba(255,255,255,.75);outline-offset:-7px;filter:none}
body.editing .tile .order{display:none}
body.editing .tile.all{opacity:.4;cursor:default}
body.editing .board,body.editing .go{opacity:.4;pointer-events:none}
.tile .voice{position:absolute;top:12px;right:12px;font-size:.72rem;font-weight:700;opacity:.9;max-width:60%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.tile .voice.warn{background:rgba(0,0,0,.35);padding:2px 8px;border-radius:999px}
.addtile{display:none;aspect-ratio:4/3;border:2px dashed var(--line);border-radius:16px;background:transparent;color:var(--sub);font-weight:700;cursor:pointer;font-size:1rem}
body.editing .addtile{display:block}
.addtile:hover{color:var(--ink);border-color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--sub);text-decoration:underline;cursor:pointer;font-size:.88rem}
dialog{border:0;border-radius:18px;padding:0;width:min(440px,calc(100vw - 32px));background:var(--panel);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,20,30,.5)}
.dlg{padding:20px}
.dlg h2{margin:0 0 14px;font-size:1.15rem}
.field{margin-bottom:14px}
.field label,.field .lbl{display:block;font-size:.85rem;color:var(--sub);margin-bottom:5px;font-weight:700}
.field input[type=text],.field select{width:100%;font:inherit;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.filebox{margin-top:8px;display:none}
.filebox.show{display:block}
.filebox input{font:inherit;font-size:.85rem;max-width:100%}
.note{font-size:.82rem;color:var(--sub);margin-top:5px;word-break:break-all}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:34px;height:34px;border-radius:10px;border:3px solid transparent;cursor:pointer;padding:0}
.swatch[aria-checked="true"]{border-color:var(--ink)}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.actions .row{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
@media (max-width:480px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media (prefers-reduced-motion:reduce){ .tile,.board .w{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="t">
      <h1>アウト発表パッド</h1>
      <p class="hint">アウトにする人を押して、OKで発表します。押した順に読み上げます。</p>
    </div>
    <button class="btn" id="editToggle" aria-pressed="false">タイルを編集</button>
  </div>
  <div class="editbar">
    <span>タイルを押すと、名前・声・色を変更できます。「＋ タイルを追加」で人を増やせます。</span>
    <button class="linkbtn" id="resetAll">初期状態に戻す</button>
    <button class="btn primary" id="editDone">完了</button>
  </div>

  <div class="board" id="board" aria-live="polite"></div>

  <div class="grid" id="grid"></div>

  <div class="go">
    <button class="clear" id="clear">クリア</button>
    <button class="ok" id="ok" disabled>OK</button>
  </div>

  <details>
    <summary>読み上げの設定</summary>
    <div class="set">
      <label for="outVoice">アウトの声</label>
      <select id="outVoice">
        <option value="out">アウト（1つ目の録音）</option>
        <option value="out2">アウト②</option>
        <option value="out3">アウト（新しい録音）</option>
      </select>
      <label for="lead">デデーンから名前まで</label>
      <input type="range" id="lead" min="0.5" max="3.5" step="0.1">
      <output id="leadOut"></output>
      <label for="gap">名前の間隔</label>
      <input type="range" id="gap" min="0.5" max="2.5" step="0.05">
      <output id="gapOut"></output>
      <label for="vol">音量</label>
      <input type="range" id="vol" min="0" max="1" step="0.01">
      <output id="volOut"></output>
    </div>
  </details>
</div>

<dialog id="dlg">
  <form class="dlg" method="dialog" onsubmit="return false">
    <h2 id="dlgTitle">タイルを編集</h2>
    <div class="field">
      <label for="fName">名前（発表ボードに出る文字）</label>
      <input type="text" id="fName" maxlength="12">
    </div>
    <div class="field">
      <label for="fVoice">読み上げる声</label>
      <select id="fVoice"></select>
      <div class="filebox" id="fileBox">
        <input type="file" id="fFile" accept="audio/*,video/*">
        <div class="note" id="fFileName"></div>
      </div>
      <div class="note">名前を変えたら、声もその名前を読んでいる音声にしてください。mp3・m4a・wavのほか、スマホの動画（mov・mp4）も選べます。動画が読み込めない場合は、音声だけのファイルにしてください。</div>
    </div>
    <div class="field">
      <span class="lbl" id="colorLbl">色</span>
      <div class="swatches" id="fColors" role="radiogroup" aria-labelledby="colorLbl"></div>
    </div>
    <div class="actions">
      <div class="row">
        <button type="button" class="btn" id="preview">試し聞き</button>
        <button type="button" class="btn danger" id="delTile">削除</button>
      </div>
      <div class="row">
        <button type="button" class="btn" id="cancel">キャンセル</button>
        <button type="button" class="btn primary" id="save">保存</button>
      </div>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* 自分で入れた音声はIndexedDBに保存（使えない環境では開いている間だけ保持） */
const memBlobs = new Map();
let dbp = null;
function db(){
  if(!dbp) dbp = new Promise(res=>{
    try{ const r = indexedDB.open('outpad',1);
      r.onupgradeneeded = ()=>r.result.createObjectStore('files');
      r.onsuccess = ()=>res(r.result); r.onerror = ()=>res(null);
    }catch(e){ res(null); }
  });
  return dbp;
}
async function putBlob(id, blob){
  memBlobs.set(id, blob);
  try{ const d = await db(); if(!d) return;
    await new Promise((res,rej)=>{ const tx=d.transaction('files','readwrite'); tx.objectStore('files').put(blob,id); tx.oncomplete=res; tx.onerror=rej; });
  }catch(e){}
}
async function getBlob(id){
  if(memBlobs.has(id)) return memBlobs.get(id);
  try{ const d = await db(); if(!d) return null;
    return await new Promise(res=>{ const r=d.transaction('files').objectStore('files').get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); });
  }catch(e){ return null; }
}
async function delBlob(id){
  memBlobs.delete(id); bufs.delete('file:'+id);
  try{ const d = await db(); if(d) d.transaction('files','readwrite').objectStore('files').delete(id); }catch(e){}
}

/* 音声 */
let ctx = null, master = null;
const bufs = new Map();
function ensureCtx(){
  if(!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = cfg.vol; master.connect(ctx.destination);
  }
  if(ctx.state === 'suspended') ctx.resume();
}
async function decodeBlob(blob){
  ensureCtx();
  const ab = await blob.arrayBuffer();
  return await new Promise((res,rej)=>ctx.decodeAudioData(ab,res,rej));
}
async function buf(key){
  if(bufs.has(key)) return bufs.get(key);
  if(key.startsWith('file:')){
    const blob = await getBlob(key.slice(5)); if(!blob) throw new Error('nofile');
    const b = await decodeBlob(blob); bufs.set(key,b); return b;
  }
  const bin = atob(SOUNDS[key].split(',')[1]);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const b = await new Promise((res,rej)=>ctx.decodeAudioData(bytes.buffer,res,rej));
  bufs.set(key,b); return b;
}

/* 選択 */
let picked = [];            // 押した順の人のid
let all = false;
const grid = document.getElementById('grid');
const board = document.getElementById('board');
const okBtn = document.getElementById('ok');

function render(){
  grid.innerHTML = PEOPLE.map(p=>{
    const i = picked.indexOf(p.id);
    const v = p.sound === 'file' ? (p.fileName ? '♪ ' + p.fileName : '声が未設定') : '';
    return `<button class="tile" data-id="${p.id}" style="--c:${p.color}" aria-pressed="${i>=0}">
      <span class="order" aria-hidden="true">${i>=0 ? i+1 : ''}</span>
      ${editing && v ? `<span class="voice${p.fileName?'':' warn'}">${esc(v)}</span>` : (!p.fileName && p.sound==='file' ? '<span class="voice warn">声が未設定</span>' : '')}
      <span class="name">${esc(p.name)}</span></button>`;
  }).join('') + `<button class="tile all" data-id="all" aria-pressed="${all}">
      <span class="order" aria-hidden="true">${all ? '✓' : ''}</span><span class="name">全員</span></button>`
    + `<button class="addtile" id="addTile">＋ タイルを追加</button>`;
  document.getElementById('addTile').onclick = addTile;
  renderBoard();
  okBtn.disabled = !playing && !all && !picked.length;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function words(){
  if(all) return [{t:'全員アウトー！', c:'out'}];
  if(!picked.length) return [];
  const w = [{t:'デデーン', c:'dd'}];
  picked.forEach(id=>w.push({t:person(id).name + '、', id}));
  w.push({t:'アウトー！', c:'out'});
  return w;
}
function renderBoard(){
  const w = words();
  board.innerHTML = w.length
    ? w.map((x,i)=>`<span class="w ${x.c||''}" data-i="${i}">${esc(x.t)}</span>`).join('')
    : '<span class="ph">ここに読み上げる内容が出ます</span>';
}
grid.addEventListener('click', e=>{
  const el = e.target.closest('.tile'); if(!el || playing) return;
  const id = el.dataset.id;
  if(editing){ if(id !== 'all') openEditor(person(id)); return; }
  if(id === 'all'){ all = !all; if(all) picked = []; }
  else{
    all = false;
    const i = picked.indexOf(id);
    if(i >= 0) picked.splice(i,1); else picked.push(id);
  }
  render();
});
document.getElementById('clear').onclick = ()=>{ if(playing) stop(); picked = []; all = false; render(); };

/* 発表 */
let playing = false, nodes = [], timers = [];
function stop(){
  nodes.forEach(n=>{ try{ n.stop(); }catch(e){} }); nodes = [];
  timers.forEach(clearTimeout); timers = [];
  playing = false;
  okBtn.textContent = 'OK'; okBtn.classList.remove('stop');
  document.querySelectorAll('.tile.speaking').forEach(t=>t.classList.remove('speaking'));
  render();
}
async function announce(){
  ensureCtx();
  const w = words(); if(!w.length) return;
  // 順番：デデーン → 名前（等間隔）→ アウト。全員なら「全員アウト」だけ（デデーンなし）
  const missing = picked.map(person).filter(p=>p.sound==='file' && !p.fileName);
  if(!all && missing.length){ toast(`「${missing[0].name}」の声が設定されていません。「タイルを編集」から設定してください`); return; }
  const keys = all ? ['allout']
    : ['dedeen', ...picked.map(id=>{ const p = person(id); return p.sound==='file' ? 'file:'+p.id : p.sound; }), cfg.out];
  let list;
  try{ list = await Promise.all(keys.map(buf)); }
  catch(e){ toast('読み込めない音声があります。「タイルを編集」で声を選び直してください'); return; }
  playing = true; okBtn.textContent = '止める'; okBtn.classList.add('stop'); okBtn.disabled = false;
  const t0 = ctx.currentTime + 0.06;
  const starts = all ? [0] : keys.map((_,i)=> i===0 ? 0 : cfg.lead + (i-1)*cfg.gap);
  list.forEach((b,i)=>{
    const s = ctx.createBufferSource(); s.buffer = b; s.connect(master); s.start(t0 + starts[i]); nodes.push(s);
    timers.push(setTimeout(()=>{
      const span = board.querySelector(`.w[data-i="${i}"]`); if(span) span.classList.add('on');
      document.querySelectorAll('.tile.speaking').forEach(t=>t.classList.remove('speaking'));
      if(w[i] && w[i].id){ const t = grid.querySelector(`[data-id="${w[i].id}"]`); if(t) t.classList.add('speaking'); }
      if(all && i===0){ const t = grid.querySelector('[data-id="all"]'); if(t) t.classList.add('speaking'); }
    }, (starts[i] + 0.06) * 1000));
  });
  const end = Math.max(...list.map((b,i)=>starts[i] + b.duration));
  timers.push(setTimeout(stop, (end + 0.3) * 1000));
}
okBtn.onclick = ()=>{ if(playing) stop(); else announce(); };
document.addEventListener('keydown', e=>{
  if(dlg.open || editing) return;
  if(e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if(e.key === 'Enter' && !e.repeat && !e.target.closest('button')){ okBtn.click(); }
  if(e.key === 'Escape' && playing) stop();
});

const outVoice = document.getElementById('outVoice');
const lead = document.getElementById('lead'), gap = document.getElementById('gap'), vol = document.getElementById('vol');
outVoice.value = cfg.out; lead.value = cfg.lead; gap.value = cfg.gap; vol.value = cfg.vol;
function syncSet(){
  document.getElementById('leadOut').textContent = (+cfg.lead).toFixed(1) + '秒';
  document.getElementById('gapOut').textContent = (+cfg.gap).toFixed(2) + '秒';
  document.getElementById('volOut').textContent = Math.round(cfg.vol*100) + '%';
}
outVoice.onchange = ()=>{ cfg.out = outVoice.value; saveCfg(); };
lead.oninput = ()=>{ cfg.lead = +lead.value; syncSet(); saveCfg(); };
gap.oninput = ()=>{ cfg.gap = +gap.value; syncSet(); saveCfg(); };
vol.oninput = ()=>{ cfg.vol = +vol.value; if(master) master.gain.setTargetAtTime(cfg.vol, ctx.currentTime, .02); syncSet(); saveCfg(); };

let editing = false;

  if(on && playing) stop();
  editing = on; document.body.classList.toggle('editing', on);
  editToggle.setAttribute('aria-pressed', on);
  editToggle.textContent = on ? '編集中…' : 'タイルを編集';
  render();
}
editToggle.onclick = ()=>setEditing(!editing);
document.getElementById('editDone').onclick = ()=>setEditing(false);
document.getElementById('resetAll').onclick = async ()=>{
  if(!confirm('タイルを最初の5人に戻します。追加したタイルや入れた音声は消えます。よろしいですか？')) return;
  for(const p of PEOPLE) if(p.sound === 'file') await delBlob(p.id);
  PEOPLE = JSON.parse(JSON.stringify(DEFAULT_PEOPLE)); picked = []; all = false;
  savePeople(); render(); toast('初期状態に戻しました');
};

/* 編集ダイアログ */
const dlg = document.getElementById('dlg');
const fName = document.getElementById('fName'), fVoice = document.getElementById('fVoice');
const fFile = document.getElementById('fFile'), fFileName = document.getElementById('fFileName');
const fileBox = document.getElementById('fileBox'), fColors = document.getElementById('fColors');
let cur = null, draft = null, pendingFile = null, isNew = false, previewNode = null;
fVoice.innerHTML = Object.entries(VOICES).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')
  + '<option value="file">自分の音声ファイル（録音・動画）</option>';
fColors.innerHTML = COLORS.map(c=>`<button type="button" class="swatch" role="radio" data-c="${c}" style="background:${c}" aria-label="色 ${c}"></button>`).join('');
fColors.onclick = e=>{ const b = e.target.closest('.swatch'); if(!b) return; draft.color = b.dataset.c; syncColors(); };
function syncColors(){ fColors.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-checked', b.dataset.c === draft.color)); }
function syncFile(){
  fileBox.classList.toggle('show', fVoice.value === 'file');
  const n = pendingFile ? pendingFile.name : (cur && cur.sound === 'file' ? cur.fileName : '');
  fFileName.textContent = n ? '選択中：' + n : 'まだファイルが選ばれていません';
}
fVoice.onchange = syncFile;
fFile.onchange = ()=>{ pendingFile = fFile.files[0] || null; syncFile(); };
function openEditor(p, asNew=false){
  cur = p; isNew = asNew; draft = {...p}; pendingFile = null; fFile.value = '';
  document.getElementById('dlgTitle').textContent = asNew ? 'タイルを追加' : 'タイルを編集';
  document.getElementById('delTile').style.display = asNew ? 'none' : '';
  fName.value = p.name; fVoice.value = p.sound;
  syncColors(); syncFile(); dlg.showModal(); fName.focus(); fName.select();
}
function addTile(){
  openEditor({id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), name:'',
    sound:'file', color:COLORS[PEOPLE.length % COLORS.length], fileName:''}, true);
}
function stopPreview(){ if(previewNode){ try{ previewNode.stop(); }catch(e){} previewNode = null; } }
dlg.addEventListener('close', stopPreview);
document.getElementById('cancel').onclick = ()=>dlg.close();
document.getElementById('preview').onclick = async ()=>{
  ensureCtx(); stopPreview();
  try{
    let b;
    if(fVoice.value === 'file'){
      if(pendingFile) b = await decodeBlob(pendingFile);
      else if(!isNew && cur.sound === 'file' && cur.fileName) b = await buf('file:'+cur.id);
      else { toast('先に音声ファイルを選んでください'); return; }
    }else b = await buf(fVoice.value);
    const s = ctx.createBufferSource(); s.buffer = b; s.connect(master); s.start(); previewNode = s;
  }catch(e){ toast('このファイルは再生できません。mp3・wav・m4a・mov などでお試しください'); }
};
document.getElementById('save').onclick = async ()=>{
  const name = fName.value.trim();
  if(!name){ toast('名前を入れてください'); fName.focus(); return; }
  const sound = fVoice.value;
  if(sound === 'file' && !pendingFile && !(cur.sound === 'file' && cur.fileName)){ toast('音声ファイルを選んでください'); return; }
  if(pendingFile){
    try{ await decodeBlob(pendingFile); }
    catch(e){ toast('このファイルは再生できません。mp3・wav・m4a・mov などでお試しください'); return; }
  }
  const next = {...draft, name, sound};
  if(sound === 'file' && pendingFile){ bufs.delete('file:'+cur.id); await putBlob(cur.id, pendingFile); next.fileName = pendingFile.name; }
  else if(sound !== 'file'){ if(cur.sound === 'file') await delBlob(cur.id); next.fileName = ''; }
  if(isNew) PEOPLE.push(next); else PEOPLE = PEOPLE.map(p=>p.id === cur.id ? next : p);
  savePeople(); render(); dlg.close(); toast(isNew ? 'タイルを追加しました' : '保存しました');
};
document.getElementById('delTile').onclick = async ()=>{
  if(!confirm(`「${cur.name}」のタイルを削除しますか？`)) return;
  await delBlob(cur.id);
  PEOPLE = PEOPLE.filter(p=>p.id !== cur.id); picked = picked.filter(id=>id !== cur.id);
  savePeople(); render(); dlg.close(); toast('削除しました');
};

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

syncSet();
render();
})();
</script>
</body>
